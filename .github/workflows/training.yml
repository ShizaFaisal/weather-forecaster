name: training
on:
  schedule: [{cron: "30 1 * * *"}]      # daily
  workflow_dispatch:                     # also called by the Drift Agent
    inputs: {reason: {description: "why", required: false, default: "manual"}}
concurrency: {group: training, cancel-in-progress: false}
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: echo "reason=${{ github.event.inputs.reason || 'schedule' }}"
      - run: python scripts/training_pipeline.py
